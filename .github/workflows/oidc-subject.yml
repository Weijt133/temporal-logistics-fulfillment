name: Read AWS OIDC subject
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  subject:
    if: github.ref == 'refs/heads/main'
    environment: demo
    runs-on: ubuntu-24.04
    steps:
      - name: Print only the subject and audience, never the token
        shell: python
        run: |
          import base64, json, os, urllib.request
          url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=sts.amazonaws.com'
          request = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with urllib.request.urlopen(request) as response:
              token = json.load(response)['value']
          part = token.split('.')[1]
          claims = json.loads(base64.urlsafe_b64decode(part + '=' * (-len(part) % 4)))
          print('GitHubOidcSubject=' + claims['sub'])
          print('Audience=' + claims['aud'])
